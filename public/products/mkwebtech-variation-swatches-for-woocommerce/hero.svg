<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" role="img" aria-labelledby="title desc">
  <title id="title">MKWebTech Variation Swatches for WooCommerce</title>
  <desc id="desc">Product attribute swatches shown inside a WooCommerce-style product interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.48" stop-color="#eefdf8"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1544" height="500" fill="url(#bg)"/>
  <circle cx="1350" cy="108" r="92" fill="#14b8a6" opacity="0.12"/>
  <circle cx="155" cy="390" r="120" fill="#6366f1" opacity="0.10"/>
  <g filter="url(#shadow)">
    <rect x="148" y="72" width="1248" height="356" rx="18" fill="#ffffff"/>
    <rect x="148" y="72" width="1248" height="64" rx="18" fill="#111827"/>
    <circle cx="190" cy="104" r="8" fill="#ef4444"/>
    <circle cx="218" cy="104" r="8" fill="#f59e0b"/>
    <circle cx="246" cy="104" r="8" fill="#22c55e"/>
    <text x="288" y="111" fill="#f9fafb" font-family="Arial, sans-serif" font-size="18" font-weight="700">WooCommerce Product</text>
    <rect x="204" y="184" width="370" height="196" rx="14" fill="#f1f5f9"/>
    <rect x="236" y="216" width="306" height="24" rx="12" fill="#cbd5e1"/>
    <rect x="236" y="260" width="240" height="16" rx="8" fill="#e2e8f0"/>
    <rect x="236" y="294" width="128" height="34" rx="17" fill="#111827"/>
    <text x="635" y="204" fill="#111827" font-family="Arial, sans-serif" font-size="36" font-weight="800">Variation swatches that feel native</text>
    <text x="637" y="246" fill="#475569" font-family="Arial, sans-serif" font-size="19">Color, dual-color, and image controls for WooCommerce attributes.</text>
    <text x="637" y="304" fill="#111827" font-family="Arial, sans-serif" font-size="20" font-weight="700">Color</text>
    <g transform="translate(637 328)">
      <circle cx="22" cy="22" r="19" fill="#2563eb"/>
      <circle cx="82" cy="22" r="19" fill="#22c55e"/>
      <circle cx="142" cy="22" r="19" fill="#ef4444"/>
      <circle cx="202" cy="22" r="19" fill="#111827"/>
      <circle cx="202" cy="22" r="24" fill="none" stroke="#111827" stroke-width="3"/>
    </g>
    <text x="905" y="304" fill="#111827" font-family="Arial, sans-serif" font-size="20" font-weight="700">Finish</text>
    <g transform="translate(905 328)">
      <rect x="0" y="0" width="48" height="48" rx="10" fill="#f97316"/>
      <rect x="62" y="0" width="48" height="48" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
      <path d="M62 48 110 0" stroke="#14b8a6" stroke-width="48"/>
      <rect x="124" y="0" width="48" height="48" rx="10" fill="#e2e8f0"/>
      <path d="M130 37 146 18 156 28 166 12" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
