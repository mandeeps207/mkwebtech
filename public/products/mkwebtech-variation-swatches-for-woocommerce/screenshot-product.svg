  <rect x="92" y="72" width="1016" height="532" rx="18" fill="#fff" stroke="#e2e8f0"/>
  <rect x="142" y="126" width="420" height="420" rx="14" fill="#eef2f7"/>
  <rect x="184" y="170" width="336" height="28" rx="14" fill="#cbd5e1"/>
  <rect x="184" y="228" width="272" height="18" rx="9" fill="#dbe3ed"/>
